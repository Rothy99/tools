    <!-- mytoolsbox Non-Intrusive Monetization Guard -->
    <script>
    (function() {
        const AD_SAFEGUARD = {
            freeToolsLimit: 2,         // Let them use tools twice completely free
            maxAdsPerSession: 2,       // Hard cap: Never show more than 2 ad cycles per visit
            sessionCountKey: 'mtb_success_runs',
            sessionLimitKey: 'mtb_ad_cycles_shown'
        };

        window.triggerToolSuccess = function() {
            let toolsRun = parseInt(sessionStorage.getItem(AD_SAFEGUARD.sessionCountKey)) || 0;
            let adsShown = parseInt(sessionStorage.getItem(AD_SAFEGUARD.sessionLimitKey)) || 0;
            
            toolsRun++;
            sessionStorage.setItem(AD_SAFEGUARD.sessionCountKey, toolsRun);
            
            if (adsShown >= AD_SAFEGUARD.maxAdsPerSession) {
                console.log('Premium Loyalty Shield: Ad limits reached. Preserving clear workspace.');
                return;
            }

            // All 3 ad zones are safely unified here to execute only after 2 successful tool uses
            if (toolsRun >= AD_SAFEGUARD.freeToolsLimit) {
                console.log('Value milestone hit. Injecting medium-revenue ad layers safely.');
                sessionStorage.setItem(AD_SAFEGUARD.sessionLimitKey, adsShown + 1);

                // Injector Component A: Vignette Banner (Zone: 11505086)
                var vignetteNode = document.createElement('script');
                vignetteNode.src = 'https://n6wxm.com/vignette.min.js';
                vignetteNode.dataset.zone = '11505086';
                vignetteNode.async = true;
                document.body.appendChild(vignetteNode);

                // Injector Component B: In-Page Push Banner (Zone: 11505091)
                var tagNode = document.createElement('script');
                tagNode.src = 'https://5gvci.com/act/files/tag.min.js?z=11505091';
                tagNode.setAttribute('data-cfasync', 'false');
                tagNode.async = true;
                document.body.appendChild(tagNode);

                // Injector Component C: New Additional Format (Zone: 11505519)
                var additionalNode = document.createElement('script');
                additionalNode.src = 'https://nap5k.com/tag.min.js';
                additionalNode.dataset.zone = '11505519';
                additionalNode.async = true;
                document.body.appendChild(additionalNode);
            }
        };
    })();
    </script>
